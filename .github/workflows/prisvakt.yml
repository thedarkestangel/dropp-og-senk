name: Dropp & Senk

on:
  schedule:
    - cron: "17 */3 * * *"   # hver 3. time
  workflow_dispatch:          # gjør at du kan kjøre den manuelt med "Run workflow"

permissions:
  contents: write
  issues: write

concurrency:
  group: dropp-og-senk
  cancel-in-progress: false

jobs:
  sjekk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sjekk priser
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_prices.py

      - name: Lagre prishistorikk
        run: |
          git config user.name "dropp-og-senk-bot"
          git config user.email "dropp-og-senk-bot@users.noreply.github.com"
          git add prices.json docs/data.json
          git diff --cached --quiet || git commit -m "Oppdater priser"
          git push
