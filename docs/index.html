<style>
:root{
  --bg:#0b0b16; --bg2:#12121f; --card:#171729; --card2:#1e1e35; --line:#2a2a45;
  --text:#f4f3ff; --muted:#9a98b8; --dim:#6c6a8a;
  --violet:#8b5cf6; --pink:#ec4899; --orange:#f59e0b; --cyan:#22d3ee;
  --down:#34d399; --down-bg:rgba(52,211,153,.14); --up:#fb7185; --up-bg:rgba(251,113,133,.14);
  --grad:linear-gradient(120deg,#8b5cf6 0%,#ec4899 55%,#f59e0b 100%);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:420px;background:radial-gradient(closest-side,rgba(139,92,246,.35),transparent),radial-gradient(closest-side at 80% 40%,rgba(236,72,153,.25),transparent);filter:blur(30px);z-index:-1;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* Topp */
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px rgba(236,72,153,.35)}
h1{margin:0;font-size:28px;letter-spacing:-.02em;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn:active{transform:scale(.94)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.demo{margin:6px 0 12px;padding:10px 14px;border-radius:14px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:#fcd34d;font-size:13px}

/* Statistikk */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.hl{background:linear-gradient(140deg,rgba(52,211,153,.18),rgba(34,211,238,.10));border-color:rgba(52,211,153,.35)}
.stat.hl .v{color:var(--down)}

/* Faner */
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{padding:7px 14px;border-radius:11px;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.3)}
.seg .n{opacity:.6;font-weight:500;margin-left:4px}
select{appearance:none;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:8px 12px;font:inherit;font-size:13px}

/* Kort */
.list{display:grid;gap:12px}
@media(min-width:640px){.list{grid-template-columns:1fr 1fr}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.985)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hue)}
.card .top{display:flex;justify-content:space-between;gap:10px}
.card .name{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--bg2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.store{color:#c4b5fd;border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.12)}
.chip.low{color:var(--down);border-color:rgba(52,211,153,.4);background:var(--down-bg)}
.chip.err{color:#fcd34d;border-color:rgba(245,158,11,.4)}
.price{text-align:right;flex-shrink:0}
.price .p{font-size:22px;font-weight:800;letter-spacing:-.02em}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:3px}
.delta.down{color:var(--down);background:var(--down-bg)} .delta.up{color:var(--up);background:var(--up-bg)} .delta.flat{color:var(--muted);background:var(--bg2)}
.spark{display:block;width:100%;height:54px;margin-top:8px}
.target{margin-top:8px}
.bar{height:6px;border-radius:999px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:999px}
.target .t{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.card.bought{opacity:.6}
.card.bought .name{text-decoration:line-through}
.badge-bought{position:absolute;right:12px;bottom:10px;font-size:11px;font-weight:700;color:var(--down)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* Arket */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg2);border-top-left-radius:26px;border-top-right-radius:26px;border:1px solid var(--line);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:11;padding:8px 18px calc(env(safe-area-inset-bottom) + 20px)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0;font-size:20px;letter-spacing:-.01em;line-height:1.25}
.big{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px}
.big .p{font-size:36px;font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chart-box{position:relative;margin:10px -6px 4px;touch-action:pan-y}
.chart-box svg{display:block;width:100%;height:220px}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s}
.tip b{display:block;font-size:14px}
.range{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.range button{font-size:12px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:999px;border:1px solid var(--line)}
.range button.on{color:var(--text);background:var(--card2);border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.kpi .v{font-weight:800;font-size:15px}.kpi .l{font-size:11px;color:var(--muted)}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.offer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;color:inherit;text-decoration:none}
.offer .s{font-weight:700}.offer .n{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.offer.best{border-color:rgba(52,211,153,.5);background:linear-gradient(120deg,rgba(52,211,153,.12),transparent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:16px;font-weight:700;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--grad);border:0;box-shadow:0 10px 30px rgba(236,72,153,.3)}
.btn.good{background:linear-gradient(120deg,#10b981,#22d3ee);border:0;color:#04121a}
.btn:active{transform:scale(.97)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input.f{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.help{font-size:12.5px;color:var(--muted);line-height:1.5}
.help a{color:#c4b5fd}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,30px);background:var(--card2);border:1px solid var(--line);padding:11px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

      <button class="icon-btn" id="settingsBtn" aria-label="Innstillinger"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<script>
// ---------- Hjelpere ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kr = n => n == null ? "–" : n.toLocaleString("nb-NO", {maximumFractionDigits: 0}) + " kr";
const pct = (a, b) => (b ? ((a - b) / b) * 100 : 0);
const DAY = 864e5;
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const PALETTE = ["#8b5cf6","#ec4899","#f59e0b","#22d3ee","#a3e635","#f472b6","#60a5fa","#fb923c","#c084fc","#2dd4bf"];
const hueFor = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (m < 1) return "akkurat nå"; if (m < 60) return `for ${m} min siden`;
  const h = Math.round(m / 60); if (h < 24) return `for ${h} t siden`;
  return new Date(iso).toLocaleString("nb-NO", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600); }

// ---------- Data ----------
let DATA = null, TAB = "active", OPEN = null, RANGE = "all";

async function load(){
  const ico = $("#refreshIco"); ico.classList.add("spin");
  try {
    const r = await fetch("data.json?ts=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw 0;
    DATA = await r.json(); $("#demo").hidden = true;
  } catch {
    DATA = demoData(); $("#demo").hidden = false;
  }
  await syncBought();
  ico.classList.remove("spin");
  render();
}

// Leser haker fra handlelisten (GitHub-issuet) direkte, så «Kjøpt» er oppdatert med en gang.
async function syncBought(){
  if (!DATA.repo || !DATA.issue) return;
  try {
    const body = await fetchIssueBody();
    const re = /^\s*[-*]\s*\[([ xX])\].*?<!--\s*id:(.+?)\s*-->/gm; let m; const map = {};
    while ((m = re.exec(body))) map[m[2].trim()] = m[1].toLowerCase() === "x";
    DATA.products.forEach(p => { if (p.id in map) p.bought = map[p.id]; });
  } catch {}
}
function ghHeaders(){ const t = store.get("pv_token"); const h = {"Accept":"application/vnd.github+json"}; if (t) h.Authorization = "Bearer " + t; return h; }
async function fetchIssueBody(){
  const r = await fetch(`https://api.github.com/repos/${DATA.repo}/issues/${DATA.issue.number}`, {headers: ghHeaders(), cache: "no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return (await r.json()).body || "";
}

// ---------- Visning ----------
function stats(){
  const act = DATA.products.filter(p => !p.bought && p.price != null);
  const weekAgo = Date.now() - 7 * DAY;
  let drops = 0, saved = 0;
  for (const p of act){
    const h = p.history || [];
    for (let i = 1; i < h.length; i++) if (new Date(h[i].t) > weekAgo && h[i].price < h[i-1].price) drops++;
    if (p.first != null && p.price < p.first) saved += p.first - p.price;
  }
  $("#sCount").textContent = DATA.products.filter(p => !p.bought).length; $("#sDrops").textContent = drops; $("#sSaved").textContent = kr(saved);
}

function spark(p, w = 300, h = 54){
  const pts = stepPoints(p.history, null);
  if (pts.length < 2) return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="${p._hue}" stroke-width="2" stroke-dasharray="4 5" opacity=".6"/></svg>`;
  const xs = pts.map(d => d.x), ys = pts.map(d => d.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = x => ((x - x0) / (x1 - x0 || 1)) * w, Y = y => h - 6 - ((y - y0) / (y1 - y0 || 1)) * (h - 14);
  const line = pts.map((d, i) => `${i ? "L" : "M"}${X(d.x).toFixed(1)},${Y(d.y).toFixed(1)}`).join("");
  const id = "g" + Math.random().toString(36).slice(2, 7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p._hue}" stop-opacity=".45"/><stop offset="1" stop-color="${p._hue}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line}L${w},${h}L0,${h}Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${p._hue}" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>`;
}

// Prisen gjelder til neste endring, så grafen tegnes som trapp og forlenges til nå.
function stepPoints(hist, since){
  const h = (hist || []).map(d => ({x: +new Date(d.t), y: d.price, store: d.store}));
  if (!h.length) return [];
  const out = [];
  h.forEach((d, i) => { if (i) out.push({x: d.x, y: h[i-1].y, store: h[i-1].store}); out.push(d); });
  out.push({x: Math.max(Date.now(), h.at(-1).x + 1), y: h.at(-1).y, store: h.at(-1).store});
  if (since){
    const before = out.filter(d => d.x < since).at(-1);
    const rest = out.filter(d => d.x >= since);
    return before ? [{...before, x: since}, ...rest] : rest;
  }
  return out;
}

function deltaChip(now, ref, suffix = ""){
  if (now == null || ref == null) return "";
  const d = now - ref, c = d < 0 ? "down" : d > 0 ? "up" : "flat";
  const arrow = d < 0 ? "↓" : d > 0 ? "↑" : "→";
  return `<span class="delta ${c}">${arrow} ${Math.abs(pct(now, ref)).toFixed(1).replace(".", ",")} %${suffix}</span>`;
}

function card(p){
  const atLow = p.price != null && p.lowest != null && p.price <= p.lowest && (p.history || []).length > 1;
  let target = "";
  if (p.target && p.price){
    const start = Math.max(p.first || p.price, p.price), span = start - p.target;
    const prog = span > 0 ? Math.min(100, Math.max(4, ((start - p.price) / span) * 100)) : 100;
    target = `<div class="target"><div class="t"><span>Mål ${kr(p.target)}</span><span>${p.price <= p.target ? "Nådd! 🎉" : kr(p.price - p.target) + " igjen"}</span></div><div class="bar"><i style="width:${prog}%"></i></div></div>`;
  }
  return `<article class="card ${p.bought ? "bought" : ""}" style="--hue:${p._hue}" data-id="${esc(p.id)}">
    <div class="top">
      <div style="min-width:0">
        <div class="name">${esc(p.name)}</div>
        <div class="chips">
          ${p.bought ? `<span class="chip low">✓ Kjøpt</span>` : ""}
          ${p.store ? `<span class="chip store">${esc(p.store)}</span>` : ""}
          ${p.offers && p.offers.length > 1 ? `<span class="chip">${p.offers.length} tilbud</span>` : ""}
          ${atLow ? `<span class="chip low">Laveste pris</span>` : ""}
          ${p.price == null ? `<span class="chip err">Venter på pris</span>` : ""}
        </div>
      </div>
      <div class="price"><div class="p">${kr(p.price)}</div>${deltaChip(p.price, p.first)}</div>
    </div>
    ${spark(p)}
    ${target}
  </article>`;
}

function render(){
  DATA.products.forEach(p => p._hue = hueFor(p.name || p.id));
  $("#updated").textContent = DATA.updated ? "Sjekket " + ago(DATA.updated) : "Ikke sjekket ennå";
  stats();
  const nA = DATA.products.filter(p => !p.bought).length, nB = DATA.products.length - nA;
  $("#nActive").textContent = nA; $("#nBought").textContent = nB || "";
  const sort = $("#sort").value;
  const items = DATA.products.filter(p => TAB === "bought" ? p.bought : !p.bought).sort((a, b) => {
    if ((a.price == null) !== (b.price == null)) return a.price == null ? 1 : -1;
    if (sort === "name") return a.name.localeCompare(b.name, "nb");
    if (sort === "price") return (a.price ?? 1e9) - (b.price ?? 1e9);
    if (sort === "recent") return +new Date((b.history || []).at(-1)?.t || 0) - +new Date((a.history || []).at(-1)?.t || 0);
    return pct(a.price ?? 0, a.first ?? a.price ?? 1) - pct(b.price ?? 0, b.first ?? b.price ?? 1);
  });
  $("#list").innerHTML = items.map(card).join("") ||
    `<div class="empty">${TAB === "bought" ? "Ingenting markert som kjøpt ennå." : "Alt er kjøpt! 🎉"}</div>`;
  if (OPEN) openSheet(OPEN, true);
}

// ---------- Detaljark ----------
function yRange(p, pts){
  const ys = pts.map(d => d.y); if (p.target) ys.push(p.target);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * .15 || y1 * .05;
  return [y0 - pad, y1 + pad, pad];
}
function bigChart(p){
  const W = 360, H = 220, padL = 6, padR = 46, padT = 30, padB = 26;
  const since = RANGE === "all" ? null : Date.now() - {"7":7,"30":30,"90":90}[RANGE] * DAY;
  const pts = stepPoints(p.history, since);
  if (pts.length < 2) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" fill="#9a98b8" font-size="13" text-anchor="middle">Grafen fylles ut etter hvert som prisen endrer seg</text></svg>`;
  const xs = pts.map(d => d.x), ys = pts.map(d => d.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const [y0, y1, pad] = yRange(p, pts);
  const X = x => padL + ((x - x0) / (x1 - x0 || 1)) * (W - padL - padR), Y = y => padT + (1 - (y - y0) / (y1 - y0 || 1)) * (H - padT - padB);
  const line = pts.map((d, i) => `${i ? "L" : "M"}${X(d.x).toFixed(1)},${Y(d.y).toFixed(1)}`).join("");
  const ticks = [Math.min(...ys), (Math.min(...ys) + Math.max(...ys)) / 2, Math.max(...ys)].map(v => Math.round(v)).filter((v, i, a) => a.indexOf(v) === i);
  const fmtD = t => new Date(t).toLocaleDateString("nb-NO", {day: "numeric", month: "short"});
  const lowY = Math.min(...ys), lowPt = pts.find(d => d.y === lowY);
  return `<svg viewBox="0 0 ${W} ${H}" id="bigsvg" data-x0="${x0}" data-x1="${x1}" data-pl="${padL}" data-pr="${padR}">
    <defs>
      <linearGradient id="bgfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec4899" stop-opacity=".45"/><stop offset=".6" stop-color="#8b5cf6" stop-opacity=".12"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
      <linearGradient id="bgline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#ec4899"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    </defs>
    ${ticks.map(v => `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2a45" stroke-dasharray="3 5"/><text x="${W - padR + 6}" y="${Y(v) + 4}" fill="#6c6a8a" font-size="11">${v.toLocaleString("nb-NO")}</text>`).join("")}
    ${p.target ? `<line x1="${padL}" x2="${W - padR}" y1="${Y(p.target)}" y2="${Y(p.target)}" stroke="#34d399" stroke-dasharray="6 4" opacity=".8"/><text x="${padL + 4}" y="${Y(p.target) - 5}" fill="#34d399" font-size="11" font-weight="700">Mål ${kr(p.target)}</text>` : ""}
    <path d="${line}L${X(x1)},${H - padB}L${X(x0)},${H - padB}Z" fill="url(#bgfill)"/>
    <path d="${line}" fill="none" stroke="url(#bgline)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="${X(lowPt.x)}" cy="${Y(lowPt.y)}" r="4.5" fill="#34d399" stroke="#0b0b16" stroke-width="2"/>
    <text x="${padL}" y="${H - 6}" fill="#6c6a8a" font-size="11">${fmtD(x0)}</text>
    <text x="${W - padR}" y="${H - 6}" fill="#6c6a8a" font-size="11" text-anchor="end">I dag</text>
    <line id="cross" x1="0" x2="0" y1="${padT - 6}" y2="${H - padB}" stroke="#fff" stroke-opacity=".35" visibility="hidden"/>
    <circle id="dot" r="6" fill="#fff" stroke="#ec4899" stroke-width="3" visibility="hidden"/>
  </svg>`;
}

function bindScrub(p){
  const box = $(".chart-box"), svg = $("#bigsvg"), tip = $(".tip");
  if (!svg) return;
  const since = RANGE === "all" ? null : Date.now() - {"7":7,"30":30,"90":90}[RANGE] * DAY;
  const raw = (p.history || []).map(d => ({x: +new Date(d.t), y: d.price, store: d.store}));
  const x0 = +svg.dataset.x0, x1 = +svg.dataset.x1, pl = +svg.dataset.pl, pr = +svg.dataset.pr;
  const move = e => {
    const r = svg.getBoundingClientRect(), vb = 360;
    const px = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * vb;
    const t = x0 + Math.min(1, Math.max(0, (px - pl) / (vb - pl - pr))) * (x1 - x0);
    const cur = raw.filter(d => d.x <= t).at(-1) || raw[0];
    if (!cur) return;
    const [y0, y1] = yRange(p, stepPoints(p.history, since));
    const Y = y => 30 + (1 - (y - y0) / (y1 - y0 || 1)) * (220 - 30 - 26);
    const X = pl + ((t - x0) / (x1 - x0 || 1)) * (vb - pl - pr);
    $("#cross").setAttribute("x1", X); $("#cross").setAttribute("x2", X); $("#cross").setAttribute("visibility", "visible");
    $("#dot").setAttribute("cx", X); $("#dot").setAttribute("cy", Y(cur.y)); $("#dot").setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${kr(cur.y)}</b>${new Date(t).toLocaleDateString("nb-NO", {day: "numeric", month: "short", year: "numeric"})}${cur.store && p.group ? " · " + esc(cur.store) : ""}`;
    tip.style.left = (X / vb * 100) + "%"; tip.style.opacity = 1;
  };
  const end = () => { tip.style.opacity = 0; $("#cross")?.setAttribute("visibility", "hidden"); $("#dot")?.setAttribute("visibility", "hidden"); };
  box.addEventListener("pointermove", move); box.addEventListener("pointerdown", move);
  box.addEventListener("pointerleave", end); box.addEventListener("pointerup", () => setTimeout(end, 1200));
}

function openSheet(id, keep){
  const p = DATA.products.find(x => x.id === id); if (!p) return;
  OPEN = id;
  const offers = (p.offers || []).slice().sort((a, b) => a.price - b.price);
  $("#sheetBody").innerHTML = `
    <h2>${esc(p.name)}</h2>
    <div class="big"><span class="p">${kr(p.price)}</span>${deltaChip(p.price, p.first, " siden start")}</div>
    <div class="sub">${p.store ? "Billigst hos " + esc(p.store) + " · " : ""}${(p.history || []).length} prisendringer registrert</div>
    <div class="chart-box">${bigChart(p)}<div class="tip"></div></div>
    <div class="range">${[["7","7 d"],["30","30 d"],["90","90 d"],["all","Alt"]].map(([k, l]) => `<button data-range="${k}" class="${RANGE === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div class="kpis">
      <div class="kpi"><div class="v">${kr(p.price)}</div><div class="l">Nå</div></div>
      <div class="kpi"><div class="v" style="color:var(--down)">${kr(p.lowest)}</div><div class="l">Laveste</div></div>
      <div class="kpi"><div class="v" style="color:var(--up)">${kr(p.highest)}</div><div class="l">Høyeste</div></div>
      <div class="kpi"><div class="v">${kr(p.first)}</div><div class="l">Start</div></div>
    </div>
    ${offers.length ? `<h3>${offers.length > 1 ? "Butikker og varianter" : "Butikk"}</h3>` + offers.map((o, i) => `
      <a class="offer ${i === 0 && offers.length > 1 ? "best" : ""}" href="${esc(o.url)}" target="_blank" rel="noopener">
        <div style="min-width:0"><div class="s">${esc(o.store)}${i === 0 && offers.length > 1 ? " · billigst" : ""}</div><div class="n">${esc(o.name || "")}</div></div>
        <div style="font-weight:800">${kr(o.price)}</div></a>`).join("") : ""}
    <div class="actions">
      <a class="btn" href="${esc(p.url || "#")}" target="_blank" rel="noopener">Åpne i butikk</a>
      <button class="btn ${p.bought ? "" : "good"}" id="buyBtn">${p.bought ? "Angre kjøpt" : "✓ Jeg har kjøpt den"}</button>
    </div>`;
  if (!keep){ $("#scrim").classList.add("on"); $("#sheet").classList.add("on"); $("#sheet").scrollTop = 0; }
  bindScrub(p);
  $("#sheetBody").querySelectorAll("[data-range]").forEach(b => b.onclick = () => { RANGE = b.dataset.range; openSheet(id, true); });
  $("#buyBtn").onclick = () => toggleBought(p);
}
function closeSheet(){ OPEN = null; $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }

// ---------- Kjøpt: haker av i handlelisten på GitHub ----------
async function toggleBought(p){
  const want = !p.bought;
  if (!DATA.repo || !DATA.issue){ p.bought = want; render(); toast(want ? "Markert som kjøpt (demo)" : "Angret (demo)"); return; }
  if (!store.get("pv_token")){ toast("Legg inn GitHub-nøkkelen først"); openSettings(); return; }
  p.bought = want; render();
  try {
    const body = await fetchIssueBody();
    const idEsc = p.id.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(`^(\\s*[-*]\\s*)\\[[ xX]\\](.*<!--\\s*id:${idEsc}\\s*-->)`, "m");
    if (!re.test(body)) throw new Error("fant ikke produktet i handlelisten");
    const newBody = body.replace(re, `$1[${want ? "x" : " "}]$2`);
    const r = await fetch(`https://api.github.com/repos/${DATA.repo}/issues/${DATA.issue.number}`, {
      method: "PATCH", headers: {...ghHeaders(), "Content-Type": "application/json"}, body: JSON.stringify({body: newBody})});
    if (!r.ok) throw new Error("GitHub svarte " + r.status);
    toast(want ? "✓ Kjøpt – overvåkningen stopper" : "Overvåkningen starter igjen");
  } catch (e) {
    p.bought = !want; render(); toast("Klarte ikke å lagre: " + e.message);
  }
}

// ---------- Oppdater nå (kjører prissjekken på GitHub) ----------
async function runNow(){
  if (!DATA.repo){ load(); return; }
  if (!store.get("pv_token")){ load(); toast("Henter siste data. Legg inn nøkkel for å kjøre ny sjekk."); return; }
  try {
    const r = await fetch(`https://api.github.com/repos/${DATA.repo}/actions/workflows/prisvakt.yml/dispatches`, {
      method: "POST", headers: {...ghHeaders(), "Content-Type": "application/json"}, body: JSON.stringify({ref: "main"})});
    if (!r.ok) throw new Error(r.status);
    toast("Prissjekk startet – nye priser om ca. 2 min");
    setTimeout(load, 120000);
  } catch (e) { toast("Kunne ikke starte sjekk (" + e.message + ")"); }
  load();
}

}
